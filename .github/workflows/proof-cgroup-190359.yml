name: Cgroup placement proof (PR 190359)

# Real-behavior proof that shell snapshot capture/validation subprocesses land in
# agent-exec (post-fix) vs the gateway cgroup (pre-fix), driven end to end through
# an isolated Gateway and the shipped CLI agent turn.
on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/shell-snapshot-exec-intent-277"
      pre_fix:
        description: "Also run the pre-fix control (rebuild with main's shell-snapshot.ts)"
        type: boolean
        required: false
        default: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 0

      - name: Checkout oc-winproof (proof scripts)
        uses: actions/checkout@v4
        with:
          path: oc-winproof
          fetch-depth: 1

      - name: Record the proof head
        run: |
          echo "openclaw head: $(git -C openclaw rev-parse HEAD)"
          git -C openclaw log --oneline -2
          grep -n 'spawnPlacedAgentShell' openclaw/src/agents/shell-snapshot.ts openclaw/src/process/spawn-utils.ts

      - name: Copy proof scripts into openclaw tree
        run: |
          mkdir -p openclaw/proofs/190359
          cp oc-winproof/proofs/190359/proof-gateway-agent.mjs openclaw/proofs/190359/
          cp oc-winproof/proofs/190359/proof-cgroup-sampler.mjs openclaw/proofs/190359/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install dependencies
        working-directory: openclaw
        run: pnpm install --frozen-lockfile

      - name: Build the shipped CLI
        working-directory: openclaw
        timeout-minutes: 15
        run: pnpm openclaw --version

      - name: Setup cgroup v2 delegation
        run: |
          set -x
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/cgroup.subtree_control' 2>&1 || true
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.subtree_control' 2>&1 || true
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.subtree_control' 2>&1 || true
          USERSVC="/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service"
          sudo bash -c "echo '+io +cpu +memory' > '$USERSVC/app.slice/cgroup.subtree_control'" 2>&1 || true
          echo "app.slice controllers: $(cat $USERSVC/app.slice/cgroup.subtree_control)"

      - name: Run post-fix proof through a real Gateway agent turn (PR head)
        timeout-minutes: 14
        run: |
          set -x
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export HOME="$RUNNER_TEMP/oc-gw-home"
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/oc-gw-state"
          export OPENCLAW_CONFIG_PATH="$RUNNER_TEMP/oc-gw-config.json"
          export OPENCLAW_GATEWAY_TOKEN="proof-token-190359"
          export OPENAI_API_KEY="proof-stub-key"
          mkdir -p "$HOME" "$OPENCLAW_STATE_DIR"
          chmod 700 "$HOME" "$OPENCLAW_STATE_DIR"
          cat > "$HOME/.bashrc" <<'BASHRC'
          # The interactive shell reports the cgroup the kernel actually put it in.
          printf '%s %s\n' "$$" "$(sed -n 's|^0::||p' /proc/$$/cgroup 2>/dev/null)" >> /tmp/proof-capture-cgroups.txt
          # Exists only in this file, so printing it proves a published snapshot was sourced.
          proof_snapshot_marker() { printf 'SNAPSHOT-WAS-SOURCED'; }
          for i in $(seq 1 500); do alias proof_alias_$i='true'; done
          sleep 0.3
          BASHRC
          cat > "$OPENCLAW_CONFIG_PATH" <<'CFG'
          {
            "gateway": { "mode": "local", "port": 18787 },
            "models": {
              "mode": "merge",
              "providers": {
                "openai": {
                  "baseUrl": "http://127.0.0.1:18799/v1",
                  "api": "openai-completions",
                  "apiKey": "proof-stub-key",
                  "agentRuntime": { "id": "openclaw" },
                  "request": { "allowPrivateNetwork": true },
                  "models": [
                    {
                      "id": "gpt-5.6-luna",
                      "name": "gpt-5.6-luna",
                      "api": "openai-completions",
                      "agentRuntime": { "id": "openclaw" },
                      "reasoning": false,
                      "input": ["text"],
                      "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                      "contextWindow": 128000,
                      "contextTokens": 96000,
                      "maxTokens": 4096
                    }
                  ]
                }
              }
            },
            "agents": { "defaults": { "model": { "primary": "openai/gpt-5.6-luna" } } },
            "tools": { "exec": { "mode": "full", "host": "gateway" } }
          }
          CFG
          systemd-run --user --unit=oc-proof-gw \
            --property=Delegate=yes --property=DelegateSubgroup=gateway \
            --working-directory="$GITHUB_WORKSPACE/openclaw" \
            --setenv=HOME="$HOME" \
            --setenv=OPENCLAW_STATE_DIR="$OPENCLAW_STATE_DIR" \
            --setenv=OPENCLAW_CONFIG_PATH="$OPENCLAW_CONFIG_PATH" \
            --setenv=OPENCLAW_GATEWAY_TOKEN="$OPENCLAW_GATEWAY_TOKEN" \
            --setenv=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --setenv=PATH="$PATH" --setenv=SHELL=/bin/bash \
            bash -c 'pnpm openclaw gateway run --port 18787 --auth token > /tmp/oc-gw.log 2>&1'
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18787/readyz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18787/readyz; then
            echo "gateway never became ready"
            tail -40 /tmp/oc-gw.log || true
            exit 1
          fi
          echo "gateway ready"
          systemctl --user show -p MainPID --value oc-proof-gw
          SAMPLER_OUT="$RUNNER_TEMP/proof-sampler.jsonl" \
          SAMPLER_READY="$RUNNER_TEMP/proof-sampler.ready" \
          SAMPLER_STOP="$RUNNER_TEMP/proof-sampler.stop" \
          PROOF_HTTP="http://127.0.0.1:18787" \
          PROOF_MOCK_PORT="18799" \
          PROOF_MOCK_CONTROL="/tmp/proof-mock-control.json" \
          PROOF_REPO="$GITHUB_WORKSPACE/openclaw" \
          PROOF_STATE_DIR="$OPENCLAW_STATE_DIR" \
          PROOF_UNIT="oc-proof-gw" \
          node "$GITHUB_WORKSPACE/openclaw/proofs/190359/proof-gateway-agent.mjs" 2>&1 | tee "$RUNNER_TEMP/postfix.log" || true
          echo "=== gateway log tail ==="
          tail -40 /tmp/oc-gw.log || true
          systemctl --user stop oc-proof-gw || true
          # The step fails unless the proof itself passed; a crashed driver and a
          # failed verdict both end up here.
          grep -Fq "PROOF VERDICT: PASS" "$RUNNER_TEMP/postfix.log" || {
            echo "post-fix proof did not report PASS"
            exit 1
          }

      - name: Run pre-fix control (main's shell-snapshot.ts)
        if: ${{ github.event.inputs.pre_fix == 'true' }}
        timeout-minutes: 18
        run: |
          set -x
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user stop oc-proof-gw || true
          systemctl --user reset-failed oc-proof-gw || true
          cd openclaw
          # The post-fix Gateway owned this build lock; the unit is stopped now.
          rm -rf .artifacts/dist-artifacts.lock
          git fetch origin main
          git checkout origin/main -- src/agents/shell-snapshot.ts src/process/spawn-utils.ts
          git diff --stat
          cd ..
          export HOME="$RUNNER_TEMP/oc-gw-home-pre"
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/oc-gw-state-pre"
          export OPENCLAW_CONFIG_PATH="$RUNNER_TEMP/oc-gw-config-pre.json"
          export OPENCLAW_GATEWAY_TOKEN="proof-token-190359"
          export OPENAI_API_KEY="proof-stub-key"
          mkdir -p "$HOME" "$OPENCLAW_STATE_DIR"
          chmod 700 "$HOME" "$OPENCLAW_STATE_DIR"
          sed 's|/tmp/proof-capture-cgroups.txt|/tmp/proof-capture-cgroups-pre.txt|' \
            "$RUNNER_TEMP/oc-gw-home/.bashrc" > "$HOME/.bashrc"
          sed -e 's/18799/18798/' -e 's/18787/18788/' "$RUNNER_TEMP/oc-gw-config.json" > "$OPENCLAW_CONFIG_PATH"
          (cd openclaw && OPENCLAW_FORCE_BUILD=1 pnpm openclaw --version)
          systemd-run --user --unit=oc-proof-gw-pre \
            --property=Delegate=yes --property=DelegateSubgroup=gateway \
            --working-directory="$GITHUB_WORKSPACE/openclaw" \
            --setenv=HOME="$HOME" \
            --setenv=OPENCLAW_STATE_DIR="$OPENCLAW_STATE_DIR" \
            --setenv=OPENCLAW_CONFIG_PATH="$OPENCLAW_CONFIG_PATH" \
            --setenv=OPENCLAW_GATEWAY_TOKEN="$OPENCLAW_GATEWAY_TOKEN" \
            --setenv=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --setenv=PATH="$PATH" --setenv=SHELL=/bin/bash \
            bash -c 'pnpm openclaw gateway run --port 18788 --auth token > /tmp/oc-gw-pre.log 2>&1'
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18788/readyz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18788/readyz; then
            echo "pre-fix gateway never became ready"
            tail -40 /tmp/oc-gw-pre.log || true
            exit 1
          fi
          SAMPLER_OUT="$RUNNER_TEMP/proof-sampler-pre.jsonl" \
          SAMPLER_READY="$RUNNER_TEMP/proof-sampler-pre.ready" \
          SAMPLER_STOP="$RUNNER_TEMP/proof-sampler-pre.stop" \
          PROOF_HTTP="http://127.0.0.1:18788" \
          PROOF_MOCK_PORT="18798" \
          PROOF_MOCK_CONTROL="/tmp/proof-mock-control-pre.json" \
          PROOF_REPO="$GITHUB_WORKSPACE/openclaw" \
          PROOF_STATE_DIR="$OPENCLAW_STATE_DIR" \
          PROOF_UNIT="oc-proof-gw-pre" \
          PROOF_TAG="-pre" \
          node "$GITHUB_WORKSPACE/openclaw/proofs/190359/proof-gateway-agent.mjs" 2>&1 | tee "$RUNNER_TEMP/prefix.log" || true
          tail -40 /tmp/oc-gw-pre.log || true
          systemctl --user stop oc-proof-gw-pre || true
          # The control must fail on placement; a PASS here means the proof cannot
          # distinguish the fix from main.
          grep -Fq "PROOF VERDICT: FAIL" "$RUNNER_TEMP/prefix.log" || {
            echo "control run did not report FAIL"
            exit 1
          }

      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgroup-proof-logs
          path: |
            ${{ runner.temp }}/postfix.log
            ${{ runner.temp }}/prefix.log
            ${{ runner.temp }}/proof-sampler*.jsonl
            /tmp/oc-gw*.log
            /tmp/proof-mock-requests*.jsonl
