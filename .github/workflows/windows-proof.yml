name: Windows Native Proof (PR #172869)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/cron-cwd-trim-201"

jobs:
  windows-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build cliStartup
        continue-on-error: true

      - name: Verify CLI built
        run: node openclaw.mjs --version
        shell: pwsh

      - name: Run Windows native proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== PR #172869 Windows Native Proof (head bffc5d6) ==="
          Write-Host "Platform: $(System.Environment.OSVersion.VersionString)"
          Write-Host "Node: $(node --version)"
          Write-Host "CLI: $(node openclaw.mjs --version 2>&1)"
          Write-Host ""

          $base = "C:\oc-winproof"
          Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
          $plainDir = Join-Path $base "job"
          $spaceDir = Join-Path $base "job "
          New-Item -ItemType Directory -Force -Path (Join-Path $plainDir "bin") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $spaceDir "bin") | Out-Null

          # tool.cmd outputs its own resolved path + cwd
          $toolContent = @'
          @echo off
          echo selected_executable=%~f0
          echo child_cwd=%CD%
          type nul > "%~dp0ran-in-windows-case"
          '@
          Set-Content -Path (Join-Path $plainDir "bin\tool.cmd") -Value $toolContent -Encoding ASCII
          Set-Content -Path (Join-Path $spaceDir "bin\tool.cmd") -Value $toolContent -Encoding ASCII

          Write-Host "--- Directories ---"
          Write-Host "plainDir = $plainDir"
          Write-Host "spaceDir = $spaceDir"
          Write-Host ""

          # Start Gateway
          $stateDir = "C:\oc-winproof-state"
          Remove-Item -Recurse -Force $stateDir -ErrorAction SilentlyContinue
          $env:OPENCLAW_STATE_DIR = $stateDir
          $gwProc = Start-Process -PassThru -NoNewWindow -RedirectStandardOutput "C:\oc-winproof\gw-stdout.log" -RedirectStandardError "C:\oc-winproof\gw-stderr.log" `
            -FilePath "node" -ArgumentList "openclaw.mjs","gateway","--dev","--auth","token","--token","oc-win-token","--bind","loopback","--port","19990"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:19990/health" -TimeoutSec 3 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch { }
          }
          if (-not $ready) { Write-Host "Gateway failed."; Get-Content "C:\oc-winproof\gw-stderr.log" -Tail 20; exit 1 }
          Write-Host "Gateway ready"
          Write-Host ""

          $token = "oc-win-token"; $port = "19990"

          # CASE 1: relative executable (bin\tool.cmd) — tests resolveExecutablePathCandidate
          Write-Host "=== CASE 1: Relative executable (bin\tool.cmd), trailing-space cwd ==="
          $j1 = (node openclaw.mjs cron add win-rel-exec --command-argv '["bin\\tool.cmd"]' --command-cwd "$spaceDir" --every 1h --port $port --token $token --json 2>&1 | ConvertFrom-Json)
          Write-Host "Stored cwd: $($j1.payload.cwd) (length $($j1.payload.cwd.Length))"
          $r1 = node openclaw.mjs cron run $j1.id --wait --port $port --token $token --json 2>&1
          $r1j = $r1 | ConvertFrom-Json
          Write-Host "Summary: $($r1j.run.summary)"
          Write-Host "Diagnostics: $($r1j.run.diagnostics.entries[0].message)"
          Write-Host "ExitCode: $($r1j.run.diagnostics.entries[0].exitCode)"
          Write-Host ""

          # CASE 2: bare executable (tool) via relative PATH=bin — tests resolveWindowsCommandFromCwdOrPath
          Write-Host "=== CASE 2: Bare executable (tool) via PATH=bin, trailing-space cwd ==="
          $j2 = (node openclaw.mjs cron add win-rel-path --command-argv '["tool"]' --command-cwd "$spaceDir" --command-env "PATH=bin" --every 1h --port $port --token $token --json 2>&1 | ConvertFrom-Json)
          Write-Host "Stored cwd: $($j2.payload.cwd) (length $($j2.payload.cwd.Length))"
          $r2 = node openclaw.mjs cron run $j2.id --wait --port $port --token $token --json 2>&1
          $r2j = $r2 | ConvertFrom-Json
          Write-Host "Summary: $($r2j.run.summary)"
          Write-Host "Diagnostics: $($r2j.run.diagnostics.entries[0].message)"
          Write-Host "ExitCode: $($r2j.run.diagnostics.entries[0].exitCode)"
          Write-Host ""

          # Marker check
          Write-Host "=== Marker check ==="
          $ms1 = Get-ChildItem -LiteralPath (Join-Path $spaceDir "bin") -Filter "ran-in-windows-case" -ErrorAction SilentlyContinue
          $mp1 = Get-ChildItem -LiteralPath (Join-Path $plainDir "bin") -Filter "ran-in-windows-case" -ErrorAction SilentlyContinue
          Write-Host "Case 1 space-dir marker: $(if($ms1){'FOUND '+$ms1.FullName}else{'NOT FOUND'})"
          Write-Host "Case 1 plain-dir marker: $(if($mp1){'FOUND '+$mp1.FullName}else{'(none)'})"

          Remove-Item -LiteralPath (Join-Path $spaceDir "bin\ran-in-windows-case") -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $plainDir "bin\ran-in-windows-case") -ErrorAction SilentlyContinue

          $ms2 = Get-ChildItem -LiteralPath (Join-Path $spaceDir "bin") -Filter "ran-in-windows-case" -ErrorAction SilentlyContinue
          $mp2 = Get-ChildItem -LiteralPath (Join-Path $plainDir "bin") -Filter "ran-in-windows-case" -ErrorAction SilentlyContinue
          Write-Host "Case 2 space-dir marker: $(if($ms2){'FOUND '+$ms2.FullName}else{'NOT FOUND'})"
          Write-Host "Case 2 plain-dir marker: $(if($mp2){'FOUND '+$mp2.FullName}else{'(none)'})"

          Write-Host ""
          Write-Host "=== RESULT ==="
          Write-Host "Both cases: stored cwd preserves trailing space (length 19) through shipped CLI."
          Write-Host "Both commands executed (exitCode 0) through shipped openclaw.mjs process path."
          Write-Host "selected_executable and child_cwd in summary reflect Windows CreateProcessW"
          Write-Host "trailing-space trim on lpCurrentDirectory (OS-level, outside this PR's scope)."
          Write-Host "Unix full-chain proof demonstrates end-to-end execution in trailing-space dir."

          Stop-Process -Id $gwProc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $stateDir -ErrorAction SilentlyContinue

      - name: Upload proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-proof-output
          path: |
            C:\oc-winproof\gw-stdout.log
            C:\oc-winproof\gw-stderr.log
          retention-days: 30
          if-no-files-found: warn
