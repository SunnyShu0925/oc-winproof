name: Windows Native Proof (PR #184162 monotonic process-start deadline)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/bug-137-windows-process-start-deadline-wall-clock"

jobs:
  windows-proof:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Checkout oc-winproof (proof scripts)
        uses: actions/checkout@v4
        with:
          path: oc-winproof
          fetch-depth: 1

      - name: Copy proof scripts into openclaw tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path proofs/184162 | Out-Null
          Copy-Item ../oc-winproof/proofs/184162/* proofs/184162/
          Get-ChildItem proofs/184162 | Select-Object Name, Length

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm runtime
        shell: pwsh
        run: |
          Write-Host "Node: $(node --version)"
          Write-Host "Platform: $([System.Environment]::OSVersion.VersionString)"

      - name: Run PR #184162 proof (post-fix)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== PR #184162 Windows Native Proof (post-fix: performance.now + Math.ceil) ==="
          Write-Host "Platform: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Node: $(node --version)"
          Write-Host "deadline line: $((Select-String -Path src/infra/windows-process-start.ts -Pattern 'const deadline =').Line.Trim())"
          Write-Host ""
          node --import tsx/esm --import ./proofs/184162/force-native-unavailable.mjs proofs/184162/proof-184162-windows.ts
          Write-Host ""
          Write-Host "post-fix: control/forward/backward all expected IDENTITY acquired (fallback runs, monotonic deadline immune to wall-clock shift)."

      - name: Run PR #184162 proof (pre-fix, Date.now reverted)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $src = "src/infra/windows-process-start.ts"
          Copy-Item $src "$src.postfix.bak"
          # Revert performance.now() -> Date.now() and drop Math.ceil (pre-fix behavior)
          $content = Get-Content $src -Raw
          $content = $content -replace 'const deadline = performance\.now\(\) \+ timeoutMs;', 'const deadline = Date.now() + timeoutMs;'
          $content = $content -replace 'const powershellBudgetMs = Math\.ceil\(deadline - performance\.now\(\)\);', 'const powershellBudgetMs = deadline - Date.now();'
          $content = $content -replace 'const remainingMs = Math\.ceil\(deadline - performance\.now\(\)\);', 'const remainingMs = deadline - Date.now();'
          Set-Content $src -Value $content -NoNewline -Encoding utf8
          Write-Host "=== PR #184162 Windows Native Proof (pre-fix: Date.now) ==="
          Write-Host "deadline line: $((Select-String -Path $src -Pattern 'const deadline =').Line.Trim())"
          Write-Host ""
          node --import tsx/esm --import ./proofs/184162/force-native-unavailable.mjs proofs/184162/proof-184162-windows.ts
          Write-Host ""
          Write-Host "pre-fix: forward jump expected NO_IDENTITY (fallback skipped, healthy probe killed); backward jump expected inflated budget."
          Copy-Item "$src.postfix.bak" $src -Force
          Remove-Item "$src.postfix.bak" -Force

      - name: Upload proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-proof-184162-output
          path: |
            openclaw/proofs/184162/proof-184162-windows.ts
            openclaw/src/infra/windows-process-start.ts
          retention-days: 30
          if-no-files-found: warn
