name: Probe io via sudo (PR 190359)

# user-1001.slice is not writable by the runner user, but sudo is available.
# Enable io up the tree via sudo so the delegated service subtree sees all
# three controllers (cpu+io+memory) required by resolveGatewayServiceCgroupDirectory().
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enable io via sudo up the tree
        run: |
          set -x
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # Enable io on user-1001.slice (needs sudo) and user@1001.service.
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.subtree_control' 2>&1 || echo "user-1001.slice failed"
          echo "user-1001.slice subtree: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.subtree_control)"
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.subtree_control' 2>&1 || echo "user@1001.service failed"
          echo "user@1001.service subtree: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.subtree_control)"
          echo "user@1001.service controllers: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.controllers)"
          # Now run a delegated transient unit and inspect its service root.
          cat > /tmp/p.sh <<'P'
          echo "IN-UNIT self cgroup: $(cat /proc/self/cgroup)"
          # service root = the .service dir (parent of gateway leaf)
          REL="$(cat /proc/self/cgroup | cut -c3-)"
          ROOT="/sys/fs/cgroup$(dirname "$REL")"
          echo "IN-UNIT service root: $ROOT"
          echo "IN-UNIT controllers: $(cat "$ROOT/cgroup.controllers")"
          echo "IN-UNIT subtree_control: $(cat "$ROOT/cgroup.subtree_control" 2>&1)"
          echo "IN-UNIT gateway procs writable? $(test -w "$ROOT/gateway/cgroup.procs" && echo YES || echo NO)"
          echo "IN-UNIT subtree_control writable? $(test -w "$ROOT/cgroup.subtree_control" && echo YES || echo NO)"
          echo "IN-UNIT gateway procs: $(cat "$ROOT/gateway/cgroup.procs" 2>&1)"
          echo "IN-UNIT svc root procs empty? [$(cat "$ROOT/cgroup.procs" 2>&1)]"
          P
          systemd-run --user --unit=probe-io2 --property=Delegate=yes --property=DelegateSubgroup=gateway bash /tmp/p.sh 2>&1
          sleep 3
          journalctl --user -u probe-io2 --no-pager -n 30 2>&1 || true
          systemctl --user stop probe-io2 2>&1 || true
          echo "=== DONE ==="