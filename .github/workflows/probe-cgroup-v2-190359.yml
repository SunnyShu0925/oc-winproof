name: Probe io via sudo root (PR 190359)

# user.slice/cgroup.subtree_control needs root to write io. Use sudo there,
# then propagate down to user-1001.slice and user@1001.service.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enable io via sudo from user.slice down
        run: |
          set -x
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "user.slice controllers: $(cat /sys/fs/cgroup/user.slice/cgroup.controllers)"
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/cgroup.subtree_control' 2>&1 || echo "user.slice FAILED"
          echo "user.slice after: $(cat /sys/fs/cgroup/user.slice/cgroup.subtree_control)"
          echo "user-1001.slice controllers: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.controllers)"
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.subtree_control' 2>&1 || echo "user-1001.slice FAILED"
          echo "user-1001.slice after: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/cgroup.subtree_control)"
          echo "user@1001.service controllers: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.controllers)"
          sudo bash -c 'echo "+io +cpu +memory" > /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.subtree_control' 2>&1 || echo "user@1001.service FAILED"
          echo "user@1001.service after: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.subtree_control)"
          echo "user@1001.service controllers after: $(cat /sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/cgroup.controllers)"
          cat > /tmp/p.sh <<'P'
          REL="$(cat /proc/self/cgroup | sed 's/^0:://')"
          ROOT="/sys/fs/cgroup$(dirname "$REL")"
          echo "IN-UNIT self cgroup: 0::$REL"
          echo "IN-UNIT service root: $ROOT"
          echo "IN-UNIT controllers: $(cat "$ROOT/cgroup.controllers")"
          echo "IN-UNIT subtree_control: $(cat "$ROOT/cgroup.subtree_control" 2>&1)"
          echo "IN-UNIT subtree_control writable? $(test -w "$ROOT/cgroup.subtree_control" && echo YES || echo NO)"
          echo "IN-UNIT gateway procs writable? $(test -w "$ROOT/gateway/cgroup.procs" && echo YES || echo NO)"
          echo "IN-UNIT svc root procs: [$(cat "$ROOT/cgroup.procs" 2>&1)]"
          P
          systemd-run --user --unit=probe-io4 --property=Delegate=yes --property=DelegateSubgroup=gateway bash /tmp/p.sh 2>&1
          sleep 3
          journalctl --user -u probe-io4 --no-pager -n 30 2>&1 || true
          systemctl --user stop probe-io4 2>&1 || true
          echo "=== DONE ==="