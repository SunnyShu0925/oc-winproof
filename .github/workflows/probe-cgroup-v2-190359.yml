name: Probe cgroup delegation v2 (PR 190359)

# Validate the full delegation chain needed by resolveGatewayServiceCgroupDirectory():
# - systemd 254+ cgroup v2 runner
# - enable linger + io controller on user manager
# - systemd-run --user transient unit with Delegate=yes/DelegateSubgroup=gateway
# - process lands in <service>/gateway leaf (matches /0::...\.service\/gateway$/)
# - io/cpu/memory controllers delegated to the service subtree
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe full cgroup delegation chain
        run: |
          set -x
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # Enable io (and re-confirm cpu/memory) on the user manager subtree
          # so a delegated child service can see all three controllers.
          USERSVC="/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service"
          echo "user service controllers before: $(cat $USERSVC/cgroup.controllers)"
          sudo bash -c "echo '+io +cpu +memory' > '$USERSVC/cgroup.subtree_control'" 2>&1 || \
            bash -c "echo '+io +cpu +memory' > '$USERSVC/cgroup.subtree_control'" 2>&1 || true
          echo "user service subtree_control: $(cat $USERSVC/cgroup.subtree_control 2>&1)"
          # Run a probe inside a delegated transient unit.
          cat > /tmp/probe-in-unit.sh <<'PROBE'
          set -x
          echo "self cgroup: $(cat /proc/self/cgroup)"
          SVCROOT="$(dirname $(dirname /sys/fs/cgroup$(cat /proc/self/cgroup | cut -c3-)))"
          echo "SVCROOT=$SVCROOT"
          ls -la "$SVCROOT" 2>&1 | head -25
          echo "svc root controllers: $(cat $SVCROOT/cgroup.controllers)"
          echo "svc root subtree_control: $(cat $SVCROOT/cgroup.subtree_control 2>&1)"
          echo "gateway leaf procs: $(cat $SVCROOT/gateway/cgroup.procs 2>&1)"
          echo "can write gateway/cgroup.procs? $(test -w $SVCROOT/gateway/cgroup.procs && echo YES || echo NO)"
          echo "can write svc root subtree_control? $(test -w $SVCROOT/cgroup.subtree_control && echo YES || echo NO)"
          PROBE
          chmod +x /tmp/probe-in-unit.sh
          systemd-run --user --unit=probe-delegate2 --property=Delegate=yes --property=DelegateSubgroup=gateway /tmp/probe-in-unit.sh 2>&1
          sleep 3
          systemctl --user status probe-delegate2 --no-pager 2>&1 | head -15 || true
          journalctl --user -u probe-delegate2 --no-pager -n 40 2>&1 || true
          systemctl --user stop probe-delegate2 2>&1 || true
          echo "=== DONE ==="