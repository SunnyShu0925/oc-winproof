name: Probe Daemon Shipped (PR 183002)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/schtasks-sqlite-lease-read-deadline-monotonic-182"

jobs:
  windows-proof:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Checkout oc-winproof (probe scripts)
        uses: actions/checkout@v4
        with:
          path: oc-winproof
          fetch-depth: 1

      - name: Copy probe scripts into openclaw tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path proofs/183002-shipped | Out-Null
          Copy-Item ../oc-winproof/proofs/183002-shipped/* proofs/183002-shipped/
          Get-ChildItem proofs/183002-shipped | Select-Object Name, Length

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build cliStartup
        continue-on-error: true

      - name: Verify CLI
        shell: pwsh
        run: |
          Write-Host "Node: $(node --version)"
          Write-Host "Platform: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "CLI: $(node openclaw.mjs --version 2>&1)"
          node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.exec('CREATE TABLE t(x)'); db.close(); console.log('node:sqlite OK on', process.platform)"

      - name: Probe shipped daemon stop (post-fix)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          & "../oc-winproof/proofs/183002-shipped/probe-daemon.ps1" `
            -OpenClawDir $root `
            -ScriptsDir (Join-Path $root "proofs/183002-shipped") `
            -StateDir "C:\oc-probe-state" `
            -Mode postfix

      - name: Probe shipped daemon stop (pre-fix, Date.now reverted)
        shell: pwsh
        run: |
          Write-Host "--- revert to pre-fix (Date.now) ---"
          $src = "src/daemon/schtasks-sqlite.ts"
          Copy-Item $src "$src.postfix.bak"
          (Get-Content $src -Raw) -replace 'performance\.now\(\)', 'Date.now()' | Set-Content $src -NoNewline -Encoding utf8
          Write-Host "deadline line: $((Select-String -Path $src -Pattern 'deadline =').Line.Trim())"
          # openclaw.mjs is a build artifact; rebuild so the revert takes effect
          Write-Host "--- rebuilding CLI with pre-fix Date.now ---"
          pnpm build cliStartup
          Write-Host "rebuilt deadline line: $((Select-String -Path $src -Pattern 'deadline =').Line.Trim())"
          $root = (Get-Location).Path
          & "../oc-winproof/proofs/183002-shipped/probe-daemon.ps1" `
            -OpenClawDir $root `
            -ScriptsDir (Join-Path $root "proofs/183002-shipped") `
            -StateDir "C:\oc-probe-state" `
            -Mode prefix
          Copy-Item "$src.postfix.bak" $src -Force
          Remove-Item "$src.postfix.bak" -Force

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-daemon-183002-output
          path: |
            C:\oc-probe-state
          retention-days: 30
          if-no-files-found: warn
