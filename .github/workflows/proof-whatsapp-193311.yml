name: WhatsApp group metadata cache elapsed-time proof (PR 193311)

# Shipped-path proof for PR 193311: the WhatsApp group metadata cache has to
# judge its lifetime on elapsed process time, not on the wall clock.
#
# Both arms run the shipped Gateway (source entry) with the bundled WhatsApp
# channel plugin, its group metadata cache owner, the inbound monitor and the
# outbound send path, and perform the send with the shipped
# `openclaw message send` CLI. No paired WhatsApp device is available on a
# runner, so the channel's real `makeWASocket` client is pointed at a local
# WhatsApp Web endpoint through the shipped OPENCLAW_WHATSAPP_WEB_SOCKET_URL
# override. That endpoint speaks the real WebSocket framing and Noise XX
# handshake, answers the group IQs over the wire, and hosts a second real Signal
# device that decrypts the group stanza (pkmsg + skmsg sender-key ciphertext)
# and reports the mention list the client actually sent.
#
# The only task-local change is the Noise trust anchor the client pins
# (node_modules/baileys/lib/Defaults/index.js); the harness swaps it in for the
# run and restores it afterwards. No file in the product tree is patched.
#
# After hydration the peer adds 15550000333 to the group WITHOUT emitting a
# group event, and the Gateway's wall clock is stepped back 30 s (Date.now only;
# performance.now keeps running). The mention is sent 304 s of real elapsed time
# later, so the 300 s TTL has elapsed for real.
#
# post-fix -> the entry is expired by elapsed time, the roster is refetched over
#             the transport and the new member's mention resolves
# pre-fix  -> the stepped wall clock moves the wall-clock deadline into the
#             future, the stale roster is served and the mention stays plain text
on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/whatsapp-group-metadata-cache-elapsed-time-297"
      wait_ms:
        description: "Real elapsed wait between hydration and the send (ms)"
        required: false
        default: "301000"
      step_back_ms:
        description: "Wall-clock step back size (ms), Date.now only"
        required: false
        default: "30000"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [post-fix, pre-fix]
    name: ${{ matrix.variant }}
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Checkout oc-winproof (proof scripts)
        uses: actions/checkout@v4
        with:
          path: oc-winproof
          fetch-depth: 1

      - name: Copy proof scripts into openclaw tree
        working-directory: openclaw
        run: |
          mkdir -p proofs/193311
          cp ../oc-winproof/proofs/193311/* proofs/193311/
          chmod +x proofs/193311/run-proof.sh
          ls -l proofs/193311

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: openclaw
        run: pnpm install --frozen-lockfile

      - name: Pin the base revision for the pre-fix arm
        if: matrix.variant == 'pre-fix'
        working-directory: openclaw
        run: |
          git remote add upstream https://github.com/openclaw/openclaw || true
          git fetch --depth=1 upstream main
          git update-ref refs/proof-base FETCH_HEAD
          git show refs/proof-base:extensions/whatsapp/src/inbound/baileys-cache.ts | grep -n "Date.now"
          git show refs/proof-base:extensions/whatsapp/src/inbound/group-metadata-cache.ts | grep -n "Date.now"

      - name: Show PR head and shipped CLI
        working-directory: openclaw
        run: |
          git rev-parse HEAD
          node --import tsx/esm src/entry.ts --version

      - name: Run shipped-Gateway real-transport proof
        working-directory: openclaw
        env:
          PROOF_VARIANT: ${{ matrix.variant == 'post-fix' && 'fixed' || 'reverted' }}
          PROOF_BASE_REF: refs/proof-base
          PROOF_WAIT_MS: ${{ github.event.inputs.wait_ms }}
          PROOF_STEP_MS: ${{ github.event.inputs.step_back_ms }}
        run: bash proofs/193311/run-proof.sh

      - name: Upload proof transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-193311-${{ matrix.variant }}
          path: |
            openclaw/proofs/193311/out-*/gateway.log
            openclaw/proofs/193311/out-*/peer.log
            openclaw/proofs/193311/out-*/send.log*
          if-no-files-found: ignore
