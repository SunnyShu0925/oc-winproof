name: Windows Settlement Shipped-CLI Proof (PR #185577 monotonic settlement deadline)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/schtasks-state-probe-settlement-monotonic"

jobs:
  windows-settlement-proof:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: openclaw
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Checkout oc-winproof (proof scripts)
        uses: actions/checkout@v4
        with:
          path: oc-winproof
          fetch-depth: 1

      - name: Copy proof scripts into openclaw tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path proofs/185577-shipped | Out-Null
          Copy-Item ../oc-winproof/proofs/185577-shipped/* proofs/185577-shipped/
          Get-ChildItem proofs/185577-shipped | Select-Object Name, Length

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm checkout
        shell: pwsh
        run: |
          Write-Host "HEAD: $(git rev-parse HEAD)"
          Write-Host "Node: $(node --version)"
          Write-Host "Platform: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "deadline line: $((Select-String -Path src/daemon/schtasks-state-probe.ts -Pattern 'const deadline =').Line.Trim())"

      - name: Build CLI (post-fix)
        continue-on-error: true
        run: pnpm build cliStartup

      - name: Verify shipped CLI entry
        shell: pwsh
        run: |
          Write-Host "dist/entry.js exists: $(Test-Path dist/entry.js)"
          node openclaw.mjs --version
          Write-Host "cli exit=$LASTEXITCODE"

      - name: Scenario post-fix forward (shipped CLI, +280s wall-clock step)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:PROOF_SHIFT_MS = "280000"
          pwsh -NoProfile -File proofs/185577-shipped/run-gateway-settlement-proof.ps1 -Label post-fix-forward -Inject

      - name: Scenario post-fix backward (shipped CLI, -280s wall-clock step)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:PROOF_SHIFT_MS = "-280000"
          pwsh -NoProfile -File proofs/185577-shipped/run-gateway-settlement-proof.ps1 -Label post-fix-backward -Inject

      - name: Patch source to pre-fix (Date.now) behavior
        shell: pwsh
        run: |
          $src = "src/daemon/schtasks-state-probe.ts"
          Copy-Item $src "$src.postfix.bak"
          $c = Get-Content $src -Raw
          $c = $c.Replace('const deadline = performance.now() + GATEWAY_SERVICE_STOP_TIMEOUT_MS;', 'const deadline = Date.now() + GATEWAY_SERVICE_STOP_TIMEOUT_MS;')
          $c = $c.Replace('const remaining = Math.max(1, deadline - performance.now());', 'const remaining = Math.max(1, deadline - Date.now());')
          $c = $c.Replace('performance.now() >= deadline', 'Date.now() >= deadline')
          $c = $c.Replace('await sleep(Math.min(100, deadline - performance.now()));', 'await sleep(Math.min(100, deadline - Date.now()));')
          Set-Content $src -Value $c -NoNewline -Encoding utf8
          Write-Host "pre-fix deadline lines:"
          Select-String -Path $src -Pattern 'deadline = |performance.now|Date.now' | ForEach-Object { Write-Host "  $($_.Line.Trim())" }

      - name: Build CLI (pre-fix)
        continue-on-error: true
        run: pnpm build cliStartup

      - name: Scenario pre-fix forward (shipped CLI, +280s wall-clock step)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:PROOF_SHIFT_MS = "280000"
          pwsh -NoProfile -File proofs/185577-shipped/run-gateway-settlement-proof.ps1 -Label pre-fix-forward -Inject

      - name: Scenario pre-fix forward past-roll (shipped CLI, +380s)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:PROOF_SHIFT_MS = "380000"
          pwsh -NoProfile -File proofs/185577-shipped/run-gateway-settlement-proof.ps1 -Label pre-fix-forward-380 -Inject

      - name: Restore source
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "src/daemon/schtasks-state-probe.ts.postfix.bak") {
            Copy-Item "src/daemon/schtasks-state-probe.ts.postfix.bak" "src/daemon/schtasks-state-probe.ts" -Force
            Remove-Item "src/daemon/schtasks-state-probe.ts.postfix.bak" -Force
          }
          git status -sb

      - name: Upload proof scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-settlement-shipped-proof-185577
          path: |
            openclaw/proofs/185577-shipped/
            openclaw/src/daemon/schtasks-state-probe.ts
          retention-days: 30
          if-no-files-found: warn
